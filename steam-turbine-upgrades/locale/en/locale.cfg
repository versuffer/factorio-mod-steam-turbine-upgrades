[mod-name]
steam-turbine-upgrades=Steam Turbine Upgrades

[mod-description]
steam-turbine-upgrades=Adds two bigger steam turbines. MK2 (60 MW, 5x7) and MK3 (140 MW, 7x10) work on regular late-game steam and consume it at the same rate per MW as the vanilla turbine, so they only save space. Output is adjustable in mod settings.

[entity-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3

[entity-description]
steam-turbine-mk2=Mid-game turbine: 60 MW by default (10-100 in mod settings), 5x7 tiles, same steam usage per MW as the vanilla turbine. Steam hotter than 500°C gives no bonus.
steam-turbine-mk3=End-game turbine: 140 MW by default (16-250 in mod settings), 7x10 tiles, same steam usage per MW as the vanilla turbine. Steam hotter than 500°C gives no bonus.

[item-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3

[item-description]
steam-turbine-mk2=60 MW by default (10-100 in mod settings), occupies 5x7 tiles. Consumes steam like a row of vanilla turbines - it saves space, not steam. One stack fits into a rocket.
steam-turbine-mk3=140 MW by default (16-250 in mod settings), occupies 7x10 tiles. Consumes steam like a row of vanilla turbines - it saves space, not steam. A single unit fills a rocket.

[recipe-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3

[technology-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3

[technology-description]
steam-turbine-mk2=Unlocks the MK2 steam turbine (60 MW, 5x7). Unlocked after the heating tower in Space Age, after nuclear power otherwise.
steam-turbine-mk3=Unlocks the MK3 steam turbine (140 MW, 7x10), costs triple the MK2 recipe.

[mod-setting-name]
steam-turbine-upgrades-mk2-power-mw=Steam turbine [color=#00a3f3][font=heading-2]MK2[/font][/color] power output
steam-turbine-upgrades-mk3-power-mw=Steam turbine [color=#ff1313][font=heading-2]MK3[/font][/color] power output

[mod-setting-description]
steam-turbine-upgrades-mk2-power-mw=Maximum MK2 output in megawatts (default 60). Steam consumption scales with it, exactly like a row of vanilla turbines.
steam-turbine-upgrades-mk3-power-mw=Maximum MK3 output in megawatts (default 140). Steam consumption scales with it, exactly like a row of vanilla turbines.
