[mod-name]
steam-turbine-upgrades=Steam Turbine Upgrades

[mod-description]
steam-turbine-upgrades=Adds two bigger steam turbines and a big heat exchanger. MK2 (60 MW, 5x7) and MK3 (180 MW, 7x10) work on regular late-game steam and consume it at the same rate per MW as the vanilla turbine, so they only save space. The big heat exchanger (60 MW, 5x5) turns heat into steam like 6 vanilla exchangers. Outputs are adjustable in mod settings.

[entity-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3
big-heat-exchanger=Big heat exchanger

[entity-description]
steam-turbine-mk2=Mid-game turbine: 60 MW by default (10-100 in mod settings), 5x7 tiles, same steam usage per MW as the vanilla turbine. Steam hotter than 500°C gives no bonus.
steam-turbine-mk3=End-game turbine: 180 MW by default (16-300 in mod settings), 7x10 tiles, same steam usage per MW as the vanilla turbine. Steam hotter than 500°C gives no bonus.
big-heat-exchanger=Consumes 60 MW of heat by default (16-100 in mod settings) and produces steam like 6 vanilla heat exchangers (~618.5 steam/s at 500°C), on 5x5 tiles. One heat port, one steam output.

[item-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3
big-heat-exchanger=Big heat exchanger

[item-description]
steam-turbine-mk2=60 MW by default (10-100 in mod settings), occupies 5x7 tiles. Consumes steam like a row of vanilla turbines - it saves space, not steam. Two units fit into a rocket.
steam-turbine-mk3=180 MW by default (16-300 in mod settings), occupies 7x10 tiles. Consumes steam like a row of vanilla turbines - it saves space, not steam. A single unit fills a rocket.
big-heat-exchanger=Consumes 60 MW of heat by default (16-100 in mod settings), occupies 5x5 tiles. Produces steam like 6 vanilla heat exchangers - it saves space, not heat. Two units fit into a rocket.

[recipe-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3
big-heat-exchanger=Big heat exchanger

[technology-name]
steam-turbine-mk2=Steam turbine MK2
steam-turbine-mk3=Steam turbine MK3

[technology-description]
steam-turbine-mk2=Unlocks the MK2 steam turbine (60 MW, 5x7). Unlocked after the heating tower in Space Age, after nuclear power otherwise.
steam-turbine-mk3=Unlocks the MK3 steam turbine (180 MW, 7x10) and the big heat exchanger (60 MW, 5x5). The turbine costs triple the MK2 recipe.

[mod-setting-name]
steam-turbine-upgrades-mk2-power-mw=Steam turbine [color=#00a3f3][font=heading-2]MK2[/font][/color] power output
steam-turbine-upgrades-mk3-power-mw=Steam turbine [color=#ff1313][font=heading-2]MK3[/font][/color] power output
steam-turbine-upgrades-big-heat-exchanger-power-mw=Big heat exchanger power output

[mod-setting-description]
steam-turbine-upgrades-mk2-power-mw=Maximum MK2 output in megawatts (default 60). Steam consumption scales with it, exactly like a row of vanilla turbines.
steam-turbine-upgrades-mk3-power-mw=Maximum MK3 output in megawatts (default 180). Steam consumption scales with it, exactly like a row of vanilla turbines.
steam-turbine-upgrades-big-heat-exchanger-power-mw=Heat consumption in megawatts (default 60). Steam production scales with it, exactly like 6 vanilla heat exchangers (~618.5 steam/s at 500°C).
